<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reiseplanlegger</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; margin: 0; }
    .line-clamp-1 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
    .line-clamp-2 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, createContext, useContext, useCallback } = React;

// ───────────── STORAGE & DATA ─────────────
const STORAGE_KEY = 'reiseplanlegger-v1';

const EMOJIS = ['✈️','🗼','🗾','🏝','🏔','🌴','🏙','🗺','🌊','⛩','🎡','🏕','🚂','🚢','🎭','🌸'];
const COLORS = [
  { label: 'Blå',     value: 'from-blue-400 to-indigo-600' },
  { label: 'Rosa',    value: 'from-pink-400 to-rose-600' },
  { label: 'Grønn',   value: 'from-emerald-400 to-teal-600' },
  { label: 'Lilla',   value: 'from-violet-400 to-purple-600' },
  { label: 'Oransje', value: 'from-orange-400 to-amber-600' },
  { label: 'Turkis',  value: 'from-cyan-400 to-blue-600' },
  { label: 'Gull',    value: 'from-yellow-400 to-orange-500' },
];
const ACTIVITY_TYPES = [
  { value: 'sightseeing', label: 'Sightseeing',  color: 'bg-blue-100 text-blue-700' },
  { value: 'food',        label: 'Mat & Drikke',  color: 'bg-orange-100 text-orange-700' },
  { value: 'shopping',    label: 'Shopping',      color: 'bg-pink-100 text-pink-700' },
  { value: 'transport',   label: 'Transport',     color: 'bg-gray-100 text-gray-700' },
  { value: 'accommodation', label: 'Overnatting', color: 'bg-indigo-100 text-indigo-700' },
  { value: 'activity',    label: 'Aktivitet',     color: 'bg-emerald-100 text-emerald-700' },
];
const DEFAULT_CATEGORIES = ['Klær','Elektronikk','Dokumenter','Toalettsaker','Medisiner','Annet'];
const BUDGET_ICONS = ['✈️','🏨','🍜','🎭','🚇','🛍','💊','📸','🎟','⚡'];

const defaultTrips = [
  {
    id: '1', name: 'Tokyo Adventure', destination: 'Tokyo, Japan',
    startDate: '2026-06-10', endDate: '2026-06-20',
    coverEmoji: '🗾', coverColor: 'from-pink-400 to-rose-600',
    description: 'Utforsk Tokyos levende gater, templer og kjøkken.',
    budget: { total: 30000, currency: 'NOK', categories: [
      { id: 'bc1', name: 'Fly', icon: '✈️', allocated: 8000, spent: 8500 },
      { id: 'bc2', name: 'Hotell', icon: '🏨', allocated: 10000, spent: 0 },
      { id: 'bc3', name: 'Mat', icon: '🍜', allocated: 5000, spent: 1200 },
    ]},
    itinerary: [
      { id: '2026-06-10', date: '2026-06-10', activities: [
        { id: 'a1', time: '14:00', title: 'Ankomst Narita', type: 'transport', notes: 'Tog til sentrum' },
        { id: 'a2', time: '20:00', title: 'Middag i Shinjuku', type: 'food', notes: 'Prøv ramen!' },
      ]},
      { id: '2026-06-11', date: '2026-06-11', activities: [
        { id: 'a3', time: '09:00', title: 'Meiji Shrine', type: 'sightseeing', notes: '' },
        { id: 'a4', time: '14:00', title: 'Harajuku', type: 'shopping', notes: '' },
        { id: 'a5', time: '17:00', title: 'Shibuya Crossing', type: 'sightseeing', notes: 'Ta bilder!' },
      ]},
    ],
    packingList: [
      { id: 'cat1', category: 'Klær', items: [
        { id: 'pi1', name: 'T-skjorter x5', packed: true },
        { id: 'pi2', name: 'Bukser x2', packed: true },
        { id: 'pi3', name: 'Jakke', packed: false },
      ]},
      { id: 'cat2', category: 'Dokumenter', items: [
        { id: 'pi4', name: 'Pass', packed: true },
        { id: 'pi5', name: 'Reiseforsikring', packed: false },
      ]},
    ]
  }
];

function loadTrips() {
  try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : defaultTrips; }
  catch { return defaultTrips; }
}
function saveTrips(trips) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(trips)); } catch {}
}

// ───────────── HELPERS ─────────────
function getDaysUntil(dateStr) {
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.ceil((d - t) / 86400000);
}
function fmtDate(dateStr, opts) {
  return new Date(dateStr).toLocaleDateString('nb-NO', opts || { day: 'numeric', month: 'long', year: 'numeric' });
}
function fmtShort(dateStr) {
  return new Date(dateStr).toLocaleDateString('nb-NO', { day: 'numeric', month: 'short' });
}
function getDaysBetween(start, end) {
  const days = []; const s = new Date(start); const e = new Date(end);
  while (s <= e) { days.push(s.toISOString().split('T')[0]); s.setDate(s.getDate()+1); }
  return days;
}
function getActType(val) { return ACTIVITY_TYPES.find(t => t.value === val) || ACTIVITY_TYPES[0]; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// ───────────── APP STATE ─────────────
function useApp() {
  const [trips, setTrips] = useState(loadTrips);
  const [page, setPage] = useState('home'); // home | trips | new | detail
  const [activeTrip, setActiveTrip] = useState(null);
  const [tab, setTab] = useState('itinerary');

  useEffect(() => { saveTrips(trips); }, [trips]);

  const navigate = (p, tripId, t) => {
    setPage(p);
    if (tripId) setActiveTrip(tripId);
    if (t) setTab(t);
  };

  const trip = trips.find(t => t.id === activeTrip);

  // Trip CRUD
  const addTrip = (data) => {
    const id = uid();
    const t = { ...data, id, itinerary: [], packingList: [],
      budget: { total: Number(data.budgetTotal)||0, currency: 'NOK', categories: [] } };
    setTrips(prev => [t, ...prev]);
    return id;
  };
  const deleteTrip = (id) => setTrips(prev => prev.filter(t => t.id !== id));

  // Itinerary
  const addActivity = (tripId, dayId, act) => {
    setTrips(prev => prev.map(t => {
      if (t.id !== tripId) return t;
      const exists = t.itinerary.find(d => d.id === dayId);
      if (exists) return { ...t, itinerary: t.itinerary.map(d => d.id === dayId
        ? { ...d, activities: [...d.activities, { ...act, id: uid() }] } : d) };
      return { ...t, itinerary: [...t.itinerary, { id: dayId, date: dayId, activities: [{ ...act, id: uid() }] }] };
    }));
  };
  const removeActivity = (tripId, dayId, actId) => {
    setTrips(prev => prev.map(t => {
      if (t.id !== tripId) return t;
      return { ...t, itinerary: t.itinerary.map(d => d.id === dayId
        ? { ...d, activities: d.activities.filter(a => a.id !== actId) } : d)
        .filter(d => d.activities.length > 0) };
    }));
  };

  // Packing
  const toggleItem = (tripId, catId, itemId) => {
    setTrips(prev => prev.map(t => t.id !== tripId ? t : { ...t, packingList: t.packingList.map(c =>
      c.id !== catId ? c : { ...c, items: c.items.map(i => i.id === itemId ? { ...i, packed: !i.packed } : i) }) }));
  };
  const addPackItem = (tripId, catId, name) => {
    setTrips(prev => prev.map(t => t.id !== tripId ? t : { ...t, packingList: t.packingList.map(c =>
      c.id !== catId ? c : { ...c, items: [...c.items, { id: uid(), name, packed: false }] }) }));
  };
  const addPackCat = (tripId, name) => {
    setTrips(prev => prev.map(t => t.id !== tripId ? t : { ...t, packingList: [...t.packingList, { id: uid(), category: name, items: [] }] }));
  };
  const removePackItem = (tripId, catId, itemId) => {
    setTrips(prev => prev.map(t => t.id !== tripId ? t : { ...t, packingList: t.packingList.map(c =>
      c.id !== catId ? c : { ...c, items: c.items.filter(i => i.id !== itemId) }) }));
  };

  // Budget
  const addBudgetCat = (tripId, cat) => {
    setTrips(prev => prev.map(t => t.id !== tripId ? t : { ...t, budget: { ...t.budget,
      categories: [...t.budget.categories, { ...cat, id: uid(), spent: 0 }] } }));
  };
  const addExpense = (tripId, catId, amount) => {
    setTrips(prev => prev.map(t => {
      if (t.id !== tripId) return t;
      const cats = t.budget.categories.map(c => c.id === catId ? { ...c, spent: c.spent + Number(amount) } : c);
      return { ...t, budget: { ...t.budget, categories: cats } };
    }));
  };

  return { trips, trip, page, tab, navigate, setTab,
    addTrip, deleteTrip, addActivity, removeActivity,
    toggleItem, addPackItem, addPackCat, removePackItem,
    addBudgetCat, addExpense };
}

// ───────────── COMPONENTS ─────────────

function Btn({ children, onClick, variant='primary', className='', type='button' }) {
  const base = 'inline-flex items-center gap-2 px-4 py-2 rounded-xl font-medium text-sm transition-all duration-200';
  const v = {
    primary: 'bg-blue-600 hover:bg-blue-700 text-white shadow-sm',
    secondary: 'bg-white hover:bg-gray-50 text-gray-700 border border-gray-200',
    danger: 'bg-red-50 hover:bg-red-100 text-red-600',
    ghost: 'text-gray-500 hover:bg-gray-100 hover:text-gray-700',
  };
  return <button type={type} onClick={onClick} className={`${base} ${v[variant]} ${className}`}>{children}</button>;
}

function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-end sm:items-center justify-center z-50 p-4">
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md">
        <div className="flex items-center justify-between p-5 border-b border-gray-100">
          <h3 className="font-bold text-gray-900">{title}</h3>
          <button onClick={onClose} className="p-1.5 hover:bg-gray-100 rounded-lg text-gray-400 transition-colors">✕</button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );
}

// ── HOME ──
function Home({ app }) {
  const upcoming = app.trips.filter(t => new Date(t.startDate) >= new Date()).sort((a,b) => new Date(a.startDate)-new Date(b.startDate));
  const next = upcoming[0];
  const stats = [
    { label: 'Totale reiser', val: app.trips.length, icon: '🗺' },
    { label: 'Kommende', val: upcoming.length, icon: '📅' },
    { label: 'Destinasjoner', val: [...new Set(app.trips.map(t => t.destination.split(',')[0]))].length, icon: '📍' },
  ];
  return (
    <div className="space-y-8">
      {/* Hero */}
      <div className="relative overflow-hidden bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-700 rounded-3xl p-8 md:p-12 text-white shadow-xl">
        <div className="relative z-10">
          <p className="text-blue-200 font-medium mb-2">Velkommen ✈️</p>
          <h1 className="text-3xl md:text-5xl font-bold mb-4 leading-tight">Din neste eventyr<br />venter på deg</h1>
          <p className="text-blue-100 text-lg mb-8 max-w-md">Planlegg reiser, bygg reiselister og spor budsjettet ditt — alt på ett sted.</p>
          <button onClick={() => app.navigate('new')}
            className="inline-flex items-center gap-2 bg-white text-blue-700 font-semibold px-6 py-3 rounded-xl shadow-lg hover:shadow-xl transition-all hover:-translate-y-0.5">
            ✈️ Planlegg ny reise →
          </button>
        </div>
        <div className="absolute -top-16 -right-16 w-64 h-64 bg-white/10 rounded-full pointer-events-none" />
        <div className="absolute -bottom-8 -right-8 w-40 h-40 bg-white/5 rounded-full pointer-events-none" />
      </div>

      {/* Stats */}
      <div className="grid grid-cols-3 gap-4">
        {stats.map(s => (
          <div key={s.label} className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 text-center">
            <div className="text-3xl mb-2">{s.icon}</div>
            <div className="text-3xl font-bold text-gray-900 mb-1">{s.val}</div>
            <div className="text-sm text-gray-500">{s.label}</div>
          </div>
        ))}
      </div>

      {/* Next trip */}
      {next && (() => {
        const d = getDaysUntil(next.startDate);
        const allItems = next.packingList.flatMap(c => c.items);
        const packPct = allItems.length > 0 ? Math.round(allItems.filter(i=>i.packed).length/allItems.length*100) : 0;
        const budgetPct = next.budget.total > 0 ? Math.min(Math.round(next.budget.categories.reduce((s,c)=>s+c.spent,0)/next.budget.total*100),100) : 0;
        const actCount = next.itinerary.flatMap(d=>d.activities).length;
        return (
          <div>
            <h2 className="text-xl font-bold text-gray-900 mb-4 flex items-center gap-3">
              Neste reise
              {d > 0 && <span className="text-sm font-normal bg-blue-100 text-blue-700 px-3 py-1 rounded-full">{d} dager igjen</span>}
            </h2>
            <button onClick={() => app.navigate('detail', next.id, 'itinerary')} className="w-full text-left group">
              <div className={`relative overflow-hidden bg-gradient-to-r ${next.coverColor} rounded-2xl p-6 text-white shadow-lg hover:shadow-xl transition-all hover:-translate-y-0.5`}>
                <div className="flex items-start justify-between">
                  <div>
                    <div className="text-5xl mb-3">{next.coverEmoji}</div>
                    <h3 className="text-2xl font-bold mb-1">{next.name}</h3>
                    <p className="text-white/80 mb-2">{next.destination}</p>
                    <p className="text-sm text-white/70">{fmtShort(next.startDate)} — {fmtShort(next.endDate)}</p>
                  </div>
                  {d > 0 && <div className="bg-white/20 rounded-2xl p-4 text-center min-w-[80px] hidden sm:block">
                    <div className="text-2xl font-bold">{d}</div>
                    <div className="text-xs text-white/80">dager</div>
                  </div>}
                </div>
                <div className="mt-5 grid grid-cols-3 gap-3">
                  {[
                    { label: 'Pakkeliste', val: packPct },
                    { label: 'Budsjett', val: budgetPct },
                    { label: 'Aktiviteter', val: Math.min(actCount*10, 100) },
                  ].map(p => (
                    <div key={p.label} className="bg-white/10 rounded-xl p-3">
                      <div className="text-xs text-white/70 mb-2">{p.label}</div>
                      <div className="h-1.5 bg-white/20 rounded-full overflow-hidden">
                        <div className="h-full bg-white rounded-full transition-all" style={{ width: p.val+'%' }} />
                      </div>
                      <div className="text-xs text-white/80 mt-1">{p.val}%</div>
                    </div>
                  ))}
                </div>
              </div>
            </button>
          </div>
        );
      })()}

      {/* Feature cards */}
      <div>
        <h2 className="text-xl font-bold text-gray-900 mb-4">Funksjoner</h2>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
          {[
            { icon: '📍', title: 'Reiseplan', desc: 'Bygg dag-for-dag reiseplan med aktiviteter og notater.' },
            { icon: '🎒', title: 'Pakkeliste', desc: 'Hold oversikt over hva du skal pakke og sjekk av etter hvert.' },
            { icon: '💰', title: 'Budsjett', desc: 'Sett budsjett per kategori og spor utgiftene dine.' },
          ].map(f => (
            <div key={f.title} className="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 hover:shadow-md transition-all hover:-translate-y-0.5">
              <div className="text-4xl mb-3">{f.icon}</div>
              <h3 className="font-bold text-gray-900 mb-2">{f.title}</h3>
              <p className="text-sm text-gray-500 leading-relaxed">{f.desc}</p>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── TRIPS LIST ──
function TripsList({ app }) {
  const upcoming = app.trips.filter(t => new Date(t.endDate) >= new Date()).sort((a,b) => new Date(a.startDate)-new Date(b.startDate));
  const past = app.trips.filter(t => new Date(t.endDate) < new Date());

  const TripCard = ({ trip }) => {
    const d = getDaysUntil(trip.startDate);
    const allItems = trip.packingList.flatMap(c => c.items);
    return (
      <div className="bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition-all hover:-translate-y-0.5 overflow-hidden">
        <div className={`h-1.5 bg-gradient-to-r ${trip.coverColor}`} />
        <div className="p-5">
          <div className="flex items-start gap-4">
            <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${trip.coverColor} flex items-center justify-center text-2xl flex-shrink-0 shadow-sm`}>
              {trip.coverEmoji}
            </div>
            <div className="flex-1 min-w-0">
              <div className="flex items-start justify-between gap-2">
                <div>
                  <h3 className="font-bold text-gray-900 text-lg leading-tight">{trip.name}</h3>
                  <p className="text-gray-500 text-sm">📍 {trip.destination}</p>
                </div>
                {d > 0 && <span className="text-xs font-semibold bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full whitespace-nowrap">{d}d</span>}
              </div>
              <p className="text-sm text-gray-400 mt-1">📅 {fmtShort(trip.startDate)} — {fmtShort(trip.endDate)}</p>
              <div className="flex gap-3 mt-2 text-xs text-gray-400">
                <span><strong className="text-gray-600">{trip.itinerary.flatMap(d=>d.activities).length}</strong> aktiviteter</span>
                {allItems.length > 0 && <span><strong className="text-gray-600">{allItems.filter(i=>i.packed).length}/{allItems.length}</strong> pakket</span>}
              </div>
            </div>
          </div>
          <div className="flex gap-2 mt-4 pt-4 border-t border-gray-100">
            <button onClick={() => app.navigate('detail', trip.id, 'itinerary')}
              className="flex-1 text-center text-sm font-medium text-blue-600 hover:bg-blue-50 py-2 rounded-xl transition-colors">
              Åpne →
            </button>
            <button onClick={() => { if(confirm('Slette denne reisen?')) app.deleteTrip(trip.id); }}
              className="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors text-sm">
              🗑
            </button>
          </div>
        </div>
      </div>
    );
  };

  return (
    <div className="space-y-8">
      <div className="flex items-center justify-between">
        <div>
          <h1 className="text-3xl font-bold text-gray-900">Mine Reiser</h1>
          <p className="text-gray-500 mt-1">{app.trips.length} reiser planlagt</p>
        </div>
        <Btn onClick={() => app.navigate('new')}>✈️ Ny reise</Btn>
      </div>

      {app.trips.length === 0 && (
        <div className="bg-white rounded-2xl border border-gray-100 shadow-sm text-center py-16">
          <div className="text-6xl mb-4">✈️</div>
          <h2 className="text-xl font-bold text-gray-900 mb-2">Ingen reiser ennå</h2>
          <p className="text-gray-500 mb-6">Kom i gang ved å planlegge din første reise!</p>
          <Btn onClick={() => app.navigate('new')}>+ Planlegg din første reise</Btn>
        </div>
      )}

      {upcoming.length > 0 && (
        <div>
          <h2 className="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
            <span className="w-2 h-2 bg-blue-500 rounded-full inline-block" /> Kommende reiser
          </h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {upcoming.map(t => <TripCard key={t.id} trip={t} />)}
          </div>
        </div>
      )}
      {past.length > 0 && (
        <div>
          <h2 className="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
            <span className="w-2 h-2 bg-gray-400 rounded-full inline-block" /> Tidligere reiser
          </h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 opacity-75">
            {past.map(t => <TripCard key={t.id} trip={t} />)}
          </div>
        </div>
      )}
    </div>
  );
}

// ── NEW TRIP ──
function NewTrip({ app }) {
  const [form, setForm] = useState({ name:'', destination:'', startDate:'', endDate:'', description:'', budgetTotal:'', coverEmoji:'✈️', coverColor: COLORS[0].value });
  const [errors, setErrors] = useState({});
  const set = (k, v) => { setForm(f => ({...f,[k]:v})); setErrors(e => ({...e,[k]:undefined})); };

  const handleSubmit = (e) => {
    e.preventDefault();
    const err = {};
    if (!form.name.trim()) err.name = 'Påkrevd';
    if (!form.destination.trim()) err.destination = 'Påkrevd';
    if (!form.startDate) err.startDate = 'Påkrevd';
    if (!form.endDate) err.endDate = 'Påkrevd';
    if (form.startDate && form.endDate && form.endDate < form.startDate) err.endDate = 'Sluttdato må være etter startdato';
    if (Object.keys(err).length) { setErrors(err); return; }
    const id = app.addTrip(form);
    app.navigate('detail', id, 'itinerary');
  };

  return (
    <div className="max-w-2xl mx-auto">
      <button onClick={() => app.navigate('trips')} className="inline-flex items-center gap-2 text-gray-500 hover:text-gray-700 mb-6 text-sm transition-colors">
        ← Tilbake til reiser
      </button>
      <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
        <div className={`h-28 bg-gradient-to-r ${form.coverColor} flex items-center justify-center relative`}>
          <div className="text-5xl">{form.coverEmoji}</div>
          <div className="absolute bottom-3 left-6 text-white/80 text-sm font-medium">
            {form.name || 'Ny reise'}{form.destination ? ` — ${form.destination}` : ''}
          </div>
        </div>
        <div className="p-6">
          <h1 className="text-2xl font-bold text-gray-900 mb-6">✈️ Planlegg ny reise</h1>
          <form onSubmit={handleSubmit} className="space-y-5">
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Reisenavn *</label>
              <input className={`w-full border rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition ${errors.name?'border-red-400':'border-gray-200'}`}
                placeholder="f.eks. Tokyo Adventure" value={form.name} onChange={e=>set('name',e.target.value)} />
              {errors.name && <p className="text-xs text-red-500 mt-1">{errors.name}</p>}
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Destinasjon *</label>
              <input className={`w-full border rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition ${errors.destination?'border-red-400':'border-gray-200'}`}
                placeholder="f.eks. Tokyo, Japan" value={form.destination} onChange={e=>set('destination',e.target.value)} />
              {errors.destination && <p className="text-xs text-red-500 mt-1">{errors.destination}</p>}
            </div>
            <div className="grid grid-cols-2 gap-4">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Avreisedato *</label>
                <input type="date" className={`w-full border rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition ${errors.startDate?'border-red-400':'border-gray-200'}`}
                  value={form.startDate} onChange={e=>set('startDate',e.target.value)} />
                {errors.startDate && <p className="text-xs text-red-500 mt-1">{errors.startDate}</p>}
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Hjemkomstdato *</label>
                <input type="date" className={`w-full border rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition ${errors.endDate?'border-red-400':'border-gray-200'}`}
                  value={form.endDate} min={form.startDate} onChange={e=>set('endDate',e.target.value)} />
                {errors.endDate && <p className="text-xs text-red-500 mt-1">{errors.endDate}</p>}
              </div>
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Totalbudsjett (NOK)</label>
              <input type="number" className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                placeholder="f.eks. 20000" value={form.budgetTotal} min="0" onChange={e=>set('budgetTotal',e.target.value)} />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Beskrivelse</label>
              <textarea className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition resize-none"
                rows={2} placeholder="Hva gleder du deg mest til?" value={form.description} onChange={e=>set('description',e.target.value)} />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-2">Ikon</label>
              <div className="flex flex-wrap gap-2">
                {EMOJIS.map(em => (
                  <button key={em} type="button" onClick={() => set('coverEmoji', em)}
                    className={`w-10 h-10 rounded-xl text-xl flex items-center justify-center transition-all ${form.coverEmoji===em?'ring-2 ring-blue-500 bg-blue-50 scale-110':'bg-gray-50 hover:bg-gray-100'}`}>
                    {em}
                  </button>
                ))}
              </div>
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-2">Kortfarge</label>
              <div className="flex flex-wrap gap-2">
                {COLORS.map(c => (
                  <button key={c.value} type="button" onClick={() => set('coverColor', c.value)} title={c.label}
                    className={`w-8 h-8 rounded-full bg-gradient-to-br ${c.value} transition-all ${form.coverColor===c.value?'ring-2 ring-offset-2 ring-blue-500 scale-110':'hover:scale-105'}`} />
                ))}
              </div>
            </div>
            <div className="flex gap-3 pt-2">
              <Btn variant="secondary" onClick={() => app.navigate('trips')} className="flex-1 justify-center">Avbryt</Btn>
              <Btn type="submit" className="flex-1 justify-center">✈️ Opprett reise</Btn>
            </div>
          </form>
        </div>
      </div>
    </div>
  );
}

// ── ITINERARY ──
function Itinerary({ trip, app }) {
  const [addingToDay, setAddingToDay] = useState(null);
  const [form, setForm] = useState({ time:'', title:'', type:'sightseeing', notes:'' });
  const [err, setErr] = useState('');
  const days = getDaysBetween(trip.startDate, trip.endDate);

  const handleAdd = (e) => {
    e.preventDefault();
    if (!form.title.trim()) { setErr('Tittel er påkrevd'); return; }
    app.addActivity(trip.id, addingToDay, form);
    setForm({ time:'', title:'', type:'sightseeing', notes:'' });
    setErr('');
    setAddingToDay(null);
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-lg font-bold text-gray-900">Reiseplan</h2>
        <span className="text-sm text-gray-500">{days.length} {days.length===1?'dag':'dager'}</span>
      </div>

      {days.map((dayStr, idx) => {
        const dayData = trip.itinerary.find(d => d.id === dayStr);
        const acts = [...(dayData?.activities||[])].sort((a,b)=>(a.time||'').localeCompare(b.time||''));
        const label = new Date(dayStr).toLocaleDateString('nb-NO', { weekday:'long', day:'numeric', month:'long' });
        return (
          <div key={dayStr} className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
            <div className="flex items-center justify-between mb-4">
              <div>
                <span className="text-xs font-bold text-blue-600 uppercase tracking-wide">Dag {idx+1}</span>
                <div className="font-semibold text-gray-900 capitalize">{label}</div>
              </div>
              <button onClick={() => { setAddingToDay(dayStr); setForm({time:'',title:'',type:'sightseeing',notes:''}); setErr(''); }}
                className="text-sm text-blue-600 hover:bg-blue-50 px-3 py-1.5 rounded-xl transition-colors font-medium">
                + Legg til
              </button>
            </div>
            {acts.length === 0 ? (
              <div className="border-2 border-dashed border-gray-200 rounded-xl py-6 text-center">
                <p className="text-gray-400 text-sm">Ingen aktiviteter ennå</p>
                <button onClick={() => { setAddingToDay(dayStr); setForm({time:'',title:'',type:'sightseeing',notes:''}); setErr(''); }}
                  className="text-blue-500 text-sm mt-1 hover:text-blue-600">+ Legg til aktivitet</button>
              </div>
            ) : (
              <div className="space-y-1">
                {acts.map(act => {
                  const t = getActType(act.type);
                  return (
                    <div key={act.id} className="flex items-start gap-3 p-3 rounded-xl hover:bg-gray-50 group transition-colors">
                      <span className={`text-xs px-2 py-1 rounded-lg font-medium flex-shrink-0 mt-0.5 ${t.color}`}>{t.label}</span>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center gap-2">
                          {act.time && <span className="text-xs text-gray-400 font-mono">⏰ {act.time}</span>}
                          <span className="font-medium text-gray-900 text-sm">{act.title}</span>
                        </div>
                        {act.notes && <p className="text-xs text-gray-500 mt-0.5">{act.notes}</p>}
                      </div>
                      <button onClick={() => app.removeActivity(trip.id, dayStr, act.id)}
                        className="opacity-0 group-hover:opacity-100 p-1 text-gray-400 hover:text-red-500 rounded transition-all">✕</button>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}

      {addingToDay && (
        <Modal title="Legg til aktivitet" onClose={() => setAddingToDay(null)}>
          <form onSubmit={handleAdd} className="space-y-4">
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Tittel *</label>
              <input autoFocus className={`w-full border rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition ${err?'border-red-400':'border-gray-200'}`}
                placeholder="f.eks. Besøk Eiffeltårnet" value={form.title} onChange={e=>{setForm(f=>({...f,title:e.target.value}));setErr('');}} />
              {err && <p className="text-xs text-red-500 mt-1">{err}</p>}
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Tid</label>
                <input type="time" className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  value={form.time} onChange={e=>setForm(f=>({...f,time:e.target.value}))} />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Type</label>
                <select className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>
                  {ACTIVITY_TYPES.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
                </select>
              </div>
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Notater</label>
              <textarea className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                rows={2} placeholder="Tips, adresse, bookinginfo..." value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} />
            </div>
            <div className="flex gap-3">
              <Btn variant="secondary" onClick={() => setAddingToDay(null)} className="flex-1 justify-center">Avbryt</Btn>
              <Btn type="submit" className="flex-1 justify-center">Legg til</Btn>
            </div>
          </form>
        </Modal>
      )}
    </div>
  );
}

// ── PACKING ──
function PackingList({ trip, app }) {
  const [addingCat, setAddingCat] = useState(false);
  const [catName, setCatName] = useState('');
  const [addingItem, setAddingItem] = useState(null);
  const [itemName, setItemName] = useState('');

  const allItems = trip.packingList.flatMap(c => c.items);
  const packed = allItems.filter(i => i.packed).length;
  const pct = allItems.length > 0 ? Math.round(packed/allItems.length*100) : 0;

  return (
    <div className="space-y-4">
      <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
        <div className="flex items-center justify-between mb-3">
          <div>
            <h2 className="text-lg font-bold text-gray-900">Pakkeliste</h2>
            <p className="text-sm text-gray-500">{packed} av {allItems.length} gjenstander pakket</p>
          </div>
          <div className="text-3xl font-bold text-blue-600">{pct}%</div>
        </div>
        <div className="h-3 bg-gray-100 rounded-full overflow-hidden">
          <div className={`h-full rounded-full transition-all duration-500 ${pct===100?'bg-emerald-500':'bg-blue-500'}`} style={{width:pct+'%'}} />
        </div>
        {pct===100 && allItems.length > 0 && <p className="text-sm text-emerald-600 font-medium mt-2">✅ Alt er pakket! Klar for avreise! 🎉</p>}
      </div>

      {trip.packingList.length === 0 && (
        <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <p className="text-sm font-semibold text-gray-700 mb-3">Kom i gang med standardkategorier:</p>
          <div className="flex flex-wrap gap-2">
            {DEFAULT_CATEGORIES.map(c => (
              <button key={c} onClick={() => app.addPackCat(trip.id, c)}
                className="text-sm px-3 py-1.5 bg-blue-50 text-blue-700 rounded-xl hover:bg-blue-100 transition-colors">
                + {c}
              </button>
            ))}
          </div>
        </div>
      )}

      {trip.packingList.map(cat => (
        <div key={cat.id} className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-2">
              <span className="font-semibold text-gray-900">📦 {cat.category}</span>
              <span className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">
                {cat.items.filter(i=>i.packed).length}/{cat.items.length}
              </span>
            </div>
            <button onClick={() => setAddingItem(addingItem===cat.id?null:cat.id)}
              className="text-xs text-blue-600 hover:bg-blue-50 px-2 py-1.5 rounded-xl transition-colors">
              + Legg til
            </button>
          </div>

          {addingItem === cat.id && (
            <form onSubmit={e=>{e.preventDefault();if(itemName.trim()){app.addPackItem(trip.id,cat.id,itemName.trim());setItemName('');setAddingItem(null);}}} className="flex gap-2 mb-3">
              <input autoFocus className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Ny gjenstand..." value={itemName} onChange={e=>setItemName(e.target.value)} />
              <Btn type="submit">+</Btn>
              <button type="button" onClick={()=>{setAddingItem(null);setItemName('');}} className="p-2 hover:bg-gray-100 rounded-xl text-gray-400">✕</button>
            </form>
          )}

          <div className="space-y-1">
            {cat.items.map(item => (
              <div key={item.id} className="flex items-center gap-3 py-2 px-2 rounded-xl hover:bg-gray-50 group transition-colors">
                <button onClick={() => app.toggleItem(trip.id, cat.id, item.id)}
                  className={`w-5 h-5 rounded-md border-2 flex items-center justify-center flex-shrink-0 transition-all ${item.packed?'bg-emerald-500 border-emerald-500':'border-gray-300 hover:border-emerald-400'}`}>
                  {item.packed && <span className="text-white text-xs font-bold">✓</span>}
                </button>
                <span className={`text-sm flex-1 transition-all ${item.packed?'line-through text-gray-400':'text-gray-700'}`}>{item.name}</span>
                <button onClick={() => app.removePackItem(trip.id, cat.id, item.id)}
                  className="opacity-0 group-hover:opacity-100 p-1 text-gray-400 hover:text-red-500 rounded transition-all text-xs">✕</button>
              </div>
            ))}
            {cat.items.length === 0 && <p className="text-xs text-gray-400 py-2 text-center">Tom kategori</p>}
          </div>
        </div>
      ))}

      {addingCat ? (
        <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <form onSubmit={e=>{e.preventDefault();if(catName.trim()){app.addPackCat(trip.id,catName.trim());setCatName('');setAddingCat(false);}}} className="flex gap-2">
            <input autoFocus className="flex-1 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Kategorinavn..." value={catName} onChange={e=>setCatName(e.target.value)} />
            <Btn type="submit">Legg til</Btn>
            <button type="button" onClick={()=>{setAddingCat(false);setCatName('');}} className="p-2 hover:bg-gray-100 rounded-xl text-gray-400">✕</button>
          </form>
        </div>
      ) : (
        <button onClick={() => setAddingCat(true)}
          className="w-full py-3 border-2 border-dashed border-gray-200 rounded-2xl text-gray-400 hover:border-blue-300 hover:text-blue-500 transition-all text-sm font-medium">
          + Legg til kategori
        </button>
      )}
    </div>
  );
}

// ── BUDGET ──
function Budget({ trip, app }) {
  const [addingCat, setAddingCat] = useState(false);
  const [catForm, setCatForm] = useState({ name:'', icon:'✈️', allocated:'' });
  const [addingExpense, setAddingExpense] = useState(null);
  const [expAmt, setExpAmt] = useState('');

  const { budget } = trip;
  const totalSpent = budget.categories.reduce((s,c) => s+c.spent, 0);
  const remaining = budget.total - totalSpent;
  const pct = budget.total > 0 ? Math.min(Math.round(totalSpent/budget.total*100), 100) : 0;
  const over = totalSpent > budget.total && budget.total > 0;

  return (
    <div className="space-y-4">
      <div className={`bg-white rounded-2xl border shadow-sm p-5 ${over?'border-red-200':'border-gray-100'}`}>
        <div className="flex items-start justify-between mb-4">
          <div>
            <h2 className="text-lg font-bold text-gray-900">Budsjett</h2>
            <p className="text-sm text-gray-500">Total ramme: {budget.total.toLocaleString('nb-NO')} {budget.currency}</p>
          </div>
          <div className="text-right">
            <div className={`text-2xl font-bold ${over?'text-red-600':remaining < budget.total*0.2?'text-orange-500':'text-emerald-600'}`}>
              {remaining.toLocaleString('nb-NO')}
            </div>
            <div className="text-xs text-gray-500">{budget.currency} igjen</div>
          </div>
        </div>
        <div className="h-3 bg-gray-100 rounded-full overflow-hidden">
          <div className={`h-full rounded-full transition-all duration-500 ${over?'bg-red-500':'bg-blue-500'}`} style={{width:pct+'%'}} />
        </div>
        <div className="flex justify-between text-xs text-gray-500 mt-1">
          <span>Brukt: <strong className="text-gray-700">{totalSpent.toLocaleString('nb-NO')} {budget.currency}</strong></span>
          <span className={over?'text-red-600 font-medium':''}>{pct}%</span>
        </div>
        {over && <div className="flex items-center gap-2 mt-3 p-3 bg-red-50 rounded-xl text-red-700 text-sm">
          ⚠️ Du har overskredet budsjettet med {(totalSpent-budget.total).toLocaleString('nb-NO')} {budget.currency}
        </div>}
      </div>

      <div className="grid grid-cols-3 gap-3">
        {[
          { label:'Totalt', val:budget.total, cls:'bg-blue-50 text-blue-700' },
          { label:'Brukt', val:totalSpent, cls:'bg-orange-50 text-orange-700' },
          { label:'Igjen', val:remaining, cls: over?'bg-red-50 text-red-700':'bg-emerald-50 text-emerald-700' },
        ].map(s => (
          <div key={s.label} className={`${s.cls} rounded-2xl p-4 text-center`}>
            <div className="text-xl font-bold">{s.val.toLocaleString('nb-NO')}</div>
            <div className="text-xs opacity-70 mt-0.5">{budget.currency} — {s.label}</div>
          </div>
        ))}
      </div>

      {budget.categories.map(cat => {
        const p = cat.allocated > 0 ? Math.min(Math.round(cat.spent/cat.allocated*100),100) : 0;
        const isOver = cat.spent > cat.allocated && cat.allocated > 0;
        return (
          <div key={cat.id} className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <span className="text-xl">{cat.icon}</span>
                <div>
                  <div className="font-medium text-gray-900 text-sm">{cat.name}</div>
                  {cat.allocated > 0 && <div className="text-xs text-gray-500">{cat.spent.toLocaleString('nb-NO')} / {cat.allocated.toLocaleString('nb-NO')} {budget.currency}</div>}
                </div>
              </div>
              <div className="flex items-center gap-2">
                {isOver && <span className="text-red-500 text-sm">⚠️</span>}
                <span className={`text-sm font-semibold ${isOver?'text-red-600':'text-gray-700'}`}>{p}%</span>
                <button onClick={() => { setAddingExpense(addingExpense===cat.id?null:cat.id); setExpAmt(''); }}
                  className="text-xs text-blue-600 hover:bg-blue-50 px-2 py-1.5 rounded-xl transition-colors">
                  + Utgift
                </button>
              </div>
            </div>
            <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
              <div className={`h-full rounded-full transition-all duration-500 ${isOver?'bg-red-400':'bg-blue-400'}`} style={{width:p+'%'}} />
            </div>
            {addingExpense === cat.id && (
              <form onSubmit={e=>{e.preventDefault();if(expAmt){app.addExpense(trip.id,cat.id,expAmt);setExpAmt('');setAddingExpense(null);}}} className="mt-3 flex gap-2">
                <input autoFocus type="number" min="0" className="flex-1 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder={`Beløp (${budget.currency})`} value={expAmt} onChange={e=>setExpAmt(e.target.value)} />
                <Btn type="submit">+</Btn>
                <button type="button" onClick={()=>setAddingExpense(null)} className="p-2 hover:bg-gray-100 rounded-xl text-gray-400">✕</button>
              </form>
            )}
          </div>
        );
      })}

      {addingCat ? (
        <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-5">
          <h3 className="font-semibold text-gray-900 mb-4">Ny budsjett-kategori</h3>
          <div className="space-y-3">
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Navn</label>
                <input autoFocus className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder="f.eks. Transport" value={catForm.name} onChange={e=>setCatForm(f=>({...f,name:e.target.value}))} />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Bevilget (NOK)</label>
                <input type="number" min="0" className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder="0" value={catForm.allocated} onChange={e=>setCatForm(f=>({...f,allocated:e.target.value}))} />
              </div>
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-2">Ikon</label>
              <div className="flex flex-wrap gap-2">
                {BUDGET_ICONS.map(ic => (
                  <button key={ic} type="button" onClick={() => setCatForm(f=>({...f,icon:ic}))}
                    className={`w-9 h-9 rounded-xl text-lg flex items-center justify-center transition-all ${catForm.icon===ic?'ring-2 ring-blue-500 bg-blue-50 scale-110':'bg-gray-50 hover:bg-gray-100'}`}>
                    {ic}
                  </button>
                ))}
              </div>
            </div>
            <div className="flex gap-3">
              <Btn variant="secondary" onClick={() => setAddingCat(false)} className="flex-1 justify-center">Avbryt</Btn>
              <Btn onClick={() => { if(catForm.name.trim()){ app.addBudgetCat(trip.id, {name:catForm.name, icon:catForm.icon, allocated:Number(catForm.allocated)||0}); setCatForm({name:'',icon:'✈️',allocated:''}); setAddingCat(false); } }} className="flex-1 justify-center">
                Legg til kategori
              </Btn>
            </div>
          </div>
        </div>
      ) : (
        <button onClick={() => setAddingCat(true)}
          className="w-full py-3 border-2 border-dashed border-gray-200 rounded-2xl text-gray-400 hover:border-blue-300 hover:text-blue-500 transition-all text-sm font-medium">
          + Legg til budsjett-kategori
        </button>
      )}
    </div>
  );
}

// ── TRIP DETAIL ──
function TripDetail({ app }) {
  const { trip, tab, setTab } = app;
  if (!trip) return (
    <div className="text-center py-20">
      <div className="text-5xl mb-4">🔍</div>
      <h2 className="text-xl font-bold text-gray-900 mb-2">Reise ikke funnet</h2>
      <Btn onClick={() => app.navigate('trips')}>← Tilbake</Btn>
    </div>
  );

  const d = getDaysUntil(trip.startDate);
  const tabs = [
    { id:'itinerary', label:'Reiseplan', icon:'📍' },
    { id:'packing',   label:'Pakkeliste', icon:'🎒' },
    { id:'budget',    label:'Budsjett', icon:'💰' },
  ];

  return (
    <div className="space-y-6">
      <button onClick={() => app.navigate('trips')} className="inline-flex items-center gap-2 text-gray-500 hover:text-gray-700 text-sm transition-colors">
        ← Mine reiser
      </button>

      <div className={`relative overflow-hidden bg-gradient-to-r ${trip.coverColor} rounded-3xl p-6 md:p-8 text-white shadow-lg`}>
        <div className="relative z-10">
          <div className="flex items-start justify-between">
            <div>
              <div className="text-4xl mb-3">{trip.coverEmoji}</div>
              <h1 className="text-3xl font-bold mb-1">{trip.name}</h1>
              <p className="text-white/80 mb-1">📍 {trip.destination}</p>
              <p className="text-white/70 text-sm">📅 {fmtDate(trip.startDate)} — {fmtDate(trip.endDate)}</p>
              {trip.description && <p className="text-white/70 text-sm mt-2 max-w-md">{trip.description}</p>}
            </div>
            {d > 0 && (
              <div className="bg-white/20 backdrop-blur-sm rounded-2xl p-4 text-center min-w-[90px] hidden sm:block">
                <div className="text-3xl font-bold">{d}</div>
                <div className="text-xs text-white/80">dager til avreise</div>
              </div>
            )}
          </div>
        </div>
        <div className="absolute -top-10 -right-10 w-48 h-48 bg-white/10 rounded-full pointer-events-none" />
      </div>

      <div className="flex gap-1 bg-white rounded-2xl p-1.5 shadow-sm border border-gray-100">
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={`flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 ${tab===t.id?'bg-blue-600 text-white shadow-sm':'text-gray-500 hover:bg-gray-50 hover:text-gray-700'}`}>
            {t.icon} <span>{t.label}</span>
          </button>
        ))}
      </div>

      {tab === 'itinerary' && <Itinerary trip={trip} app={app} />}
      {tab === 'packing'   && <PackingList trip={trip} app={app} />}
      {tab === 'budget'    && <Budget trip={trip} app={app} />}
    </div>
  );
}

// ── LAYOUT ──
function Layout({ page, app, children }) {
  const navItems = [
    { id:'home',  label:'Hjem',        icon:'🏠' },
    { id:'trips', label:'Mine Reiser', icon:'🗺' },
  ];
  return (
    <div className="min-h-screen bg-gradient-to-br from-sky-50 via-blue-50 to-indigo-50">
      <header className="bg-white/80 backdrop-blur-sm border-b border-blue-100 sticky top-0 z-40">
        <div className="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
          <button onClick={() => app.navigate('home')} className="flex items-center gap-2 text-blue-700 font-bold text-xl hover:opacity-80 transition-opacity">
            <div className="w-9 h-9 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-sm text-white text-base">✈️</div>
            <span>Reiseplanlegger</span>
          </button>
          <nav className="flex items-center gap-1">
            {navItems.map(n => (
              <button key={n.id} onClick={() => app.navigate(n.id)}
                className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium transition-all ${page===n.id?'bg-blue-600 text-white shadow-sm':'text-gray-600 hover:bg-blue-50 hover:text-blue-700'}`}>
                <span>{n.icon}</span>
                <span className="hidden sm:inline">{n.label}</span>
              </button>
            ))}
          </nav>
        </div>
      </header>
      <main className="max-w-5xl mx-auto px-4 py-8">{children}</main>
      <footer className="border-t border-blue-100 bg-white/60 mt-16">
        <div className="max-w-5xl mx-auto px-4 py-6 text-center text-sm text-gray-400">
          🌍 Reiseplanlegger — Planlegg ditt neste eventyr
        </div>
      </footer>
    </div>
  );
}

// ── ROOT ──
function App() {
  const app = useApp();
  return (
    <Layout page={app.page} app={app}>
      {app.page === 'home'   && <Home app={app} />}
      {app.page === 'trips'  && <TripsList app={app} />}
      {app.page === 'new'    && <NewTrip app={app} />}
      {app.page === 'detail' && <TripDetail app={app} />}
    </Layout>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
